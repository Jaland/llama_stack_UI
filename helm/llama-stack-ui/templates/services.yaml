---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llama-stack-ui.fullname" . }}-client
  labels:
    {{- include "llama-stack-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: {{ .Values.client.service.type }}
  ports:
    - port: {{ .Values.client.service.port }}
      targetPort: {{ .Values.client.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "llama-stack-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: client
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llama-stack-ui.fullname" . }}-server
  labels:
    {{- include "llama-stack-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: {{ .Values.server.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "llama-stack-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server